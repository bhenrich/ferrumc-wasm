# --- Particles (pre-reserved for the particle feature lane) ----------------------
#
# Id verified against fixtures/protocol/1_21_8/protocol.json (protocol 772):
# world_particles 0x29.
#
# DEVIATION: the leading fields (flags, position, per-axis offset, max speed,
# particle count) are fixed-width and modeled typed. The trailing particle is a
# tagged union — a VarInt particle-type id (`kind`) followed by a per-type data
# payload (e.g. block state for `block`, RGB + scale for `dust`, an item Slot for
# `item`) that the closed grammar cannot express. `kind` (the VarInt type id) is
# typed; the per-type data is carried as opaque `data` (`remaining_bytes`),
# hand-encoded by the particle feature lane per type id and covered by golden-byte
# tests. (`kind`/`data` follow the Heightmap naming; a `particle_*` prefix would
# trip clippy's struct_field_names on the generated struct.) Clientbound-only; the
# generated decode is never exercised at runtime.
[[packet]]
state = "play"
direction = "clientbound"
name = "Particle"
id = 0x29
fields = [
    { name = "long_distance", type = "bool" },
    { name = "always_show", type = "bool" },
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    { name = "offset_x", type = "f32" },
    { name = "offset_y", type = "f32" },
    { name = "offset_z", type = "f32" },
    { name = "max_speed", type = "f32" },
    { name = "count", type = "i32" },
    { name = "kind", type = "varint" },
    { name = "data", type = "remaining_bytes" },
]

