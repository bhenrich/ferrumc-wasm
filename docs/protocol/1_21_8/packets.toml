# minecraft-data: play.toClient.entity_equipment ("Set Equipment"). Shows other
# players what a remote player is holding/wearing. protocol.json models the body
# as `entityId: varint` then `equipments: topBitSetTerminatedArray<{ slot: i8,
# item: Slot }>` — a continuation-bit-terminated array (each slot byte's high bit
# 0x80 flags "another entry follows"; the last entry has it clear) whose `item` is
# the count-first 1.21.8 Slot. The closed packets.toml grammar has no
# topBitSetTerminatedArray and no Slot type, so — exactly like Commands /
# PlayerInfoUpdate / SetContainerContent — the variable tail is carried as one
# opaque `remaining_bytes` payload, hand-encoded by the app (which owns the
# ferrumc-items Slot encoder) and passed through the router, which only prepends
# the router-owned `entity_id`. For the main-hand-only v0 the body is a single
# terminal slot byte `0x00` (slot 0 = main hand) followed by the trusted Slot;
# armor/offhand are a later addition. `remaining_bytes` must be the final field,
# which it is.
[[packet]]
state = "play"
direction = "clientbound"
name = "SetEquipment"
id = 0x5F
fields = [
    { name = "entity_id", type = "varint" },
    { name = "equipments", type = "remaining_bytes" },
]

# --- Command tree / tab-completion (client autocomplete) ------------------------
#
# These three packets hand the vanilla client its command graph (so `/spawn` and
# `/gamemode` render as valid, not red) and drive tab-completion. Ids verified
# against fixtures/protocol/1_21_8/protocol.json (protocol 772): clientbound
# declare_commands 0x10, serverbound tab_complete 0x0E, clientbound tab_complete
# 0x0F (all free in the play id set).

# minecraft-data: play.toClient.declare_commands ("Commands"). The Brigadier node
# graph is a flags-driven, self-referential structure — a bitfield byte, a redirect
# switch on that bitfield, and a per-node-type switch whose argument branch nests a
# parser mapper plus a parser-keyed properties switch — that the closed packets.toml
# type grammar (no bitfield / switch / mapper) cannot express. It is therefore
# carried as ONE opaque `remaining_bytes` payload, hand-encoded by
# `ferrumc_command::CommandTree::encode_commands_body` (covered by a byte-level
# test). That payload is the WHOLE body: the varint node count, then every node's
# bytes, then the trailing varint rootIndex. rootIndex lives INSIDE the blob after
# the node array (NOT a separate trailing field) precisely because `remaining_bytes`
# must be the packet's final field. Commands is clientbound-only, so the generated
# `decode` for `remaining_bytes` is never exercised at runtime.
[[packet]]
state = "play"
direction = "clientbound"
name = "Commands"
id = 0x10
fields = [{ name = "payload", type = "remaining_bytes" }]

# minecraft-data: play.toServer.tab_complete ("Command Suggestions Request"). The
# client sends the in-progress command text and a transaction id the server echoes.
[[packet]]
state = "play"
direction = "serverbound"
name = "TabCompleteRequest"
id = 0x0E
fields = [
    { name = "transaction_id", type = "varint" },
    { name = "text", type = "string(32767)" },
]

# minecraft-data: play.toClient.tab_complete ("Command Suggestions Response").
# `start`/`length` delimit the substring of the client's input the `matches`
# replace; each match is a completion string plus an optional NBT tooltip.
[[packet]]
state = "play"
direction = "clientbound"
name = "TabCompleteResponse"
id = 0x0F
fields = [
    { name = "transaction_id", type = "varint" },
    { name = "start", type = "varint" },
    { name = "length", type = "varint" },
    { name = "matches", type = "prefixed_array<CommandSuggestionMatch>" },
]

# --- Inventory / held item (data-component item slots) --------------------------
#
# Ids verified against fixtures/protocol/1_21_8/protocol.json (protocol 772):
# serverbound set_creative_slot 0x37, held_item_slot 0x34; clientbound
# window_items 0x12, set_slot 0x14, held_item_slot 0x62.
#
# Every slot-bearing field is carried as opaque `remaining_bytes` and hand-encoded
# / decoded by the `ferrumc-items` crate. The real Slot/UntrustedSlot wire form is
# count-first (itemCount varint; if non-zero, itemId + a type-id-keyed component
# switch/byte-array) — a tagged union the closed packets.toml grammar cannot
# express — so it follows the same opaque-bytes precedent as the Commands packet.
# `remaining_bytes` must be a packet's final field, which is why SetContainerContent
# folds its items array AND the carried item into one `payload`, and SetCreativeSlot
# / SetContainerSlot put the slot `item` last.

# minecraft-data: play.toServer.set_creative_slot ("Set Creative Mode Slot"). The
# `item` is an UntrustedSlot, decoded + validated by ferrumc-items::UntrustedItemStack.
[[packet]]
state = "play"
direction = "serverbound"
name = "SetCreativeSlot"
id = 0x37
fields = [
    { name = "slot", type = "i16" },
    { name = "item", type = "remaining_bytes" },
]

# minecraft-data: play.toServer.held_item_slot ("Set Held Item"). NOTE: the
# serverbound form is a fixed i16 slotId (the clientbound form below is a varint);
# the two directions differ, so they are direction-prefixed.
[[packet]]
state = "play"
direction = "serverbound"
name = "ServerboundSetHeldItem"
id = 0x34
fields = [{ name = "slot", type = "i16" }]

# minecraft-data: play.toClient.window_items ("Set Container Content"). `payload`
# is the whole trusted body after the state id: a varint slot count, each slot,
# then the carried (cursor) slot — built by
# ferrumc-items::encode_container_content_payload. windowId is a ContainerID (varint).
[[packet]]
state = "play"
direction = "clientbound"
name = "SetContainerContent"
id = 0x12
fields = [
    { name = "window_id", type = "varint" },
    { name = "state_id", type = "varint" },
    { name = "payload", type = "remaining_bytes" },
]

# minecraft-data: play.toClient.set_slot ("Set Container Slot"). `item` is a single
# trusted Slot, encoded by ferrumc-items::ItemStack::encode_slot. windowId is a
# ContainerID (varint).
[[packet]]
state = "play"
direction = "clientbound"
name = "SetContainerSlot"
id = 0x14
fields = [
    { name = "window_id", type = "varint" },
    { name = "state_id", type = "varint" },
    { name = "slot", type = "i16" },
    { name = "item", type = "remaining_bytes" },
]

# minecraft-data: play.toClient.open_window ("Open Screen"). Opens a container GUI
# on the client: `window_id` is the ContainerID (varint) the server assigns and the
# client echoes on Click Container / Close Container; `window_type` is the
# minecraft:menu registry id (generic_9x3 = 2, a single chest — verified against the
# pinned 1.21.8 menu registry); `title` is the window title as a network-NBT text
# component (the `nbt` type, written by ferrumc_nbt::write_network_root).
[[packet]]
state = "play"
direction = "clientbound"
name = "OpenScreen"
id = 0x34
fields = [
    { name = "window_id", type = "varint" },
    { name = "window_type", type = "varint" },
    { name = "title", type = "nbt" },
]

# minecraft-data: play.toClient.held_item_slot ("Set Held Item"). The clientbound
# form is a varint slot (the serverbound form above is an i16); direction-prefixed.
[[packet]]
state = "play"
direction = "clientbound"
name = "ClientboundSetHeldItem"
id = 0x62
fields = [{ name = "slot", type = "varint" }]

