# Declarative packet spec for Minecraft Java 1.21.8 (protocol 772).
#
# This file is the single source of truth for the generated packet codecs in
# `crates/ferrumc-proto/src/generated/`. Edit this spec, then run
# `cargo xtask generate` to regenerate the Rust, and `cargo xtask generate
# --check` to verify the committed tree matches.
#
# Scope: the handshake / status / login / configuration states, plus the minimal
# play-state subset needed for a flat-world join, player movement, and block
# changes. The remaining play packets are out of scope for this milestone.
#
# Field `type` grammar (a closed set; the generator rejects anything else):
#   varint | varlong              signed LEB128 integers (i32 / i64)
#   u16 | i16 | i32 | u32 | i64   fixed-width big-endian integers
#   i8 | u8                       single signed / unsigned bytes
#   f32 | f64                     big-endian IEEE-754 floats
#   bool                          single byte, 0 = false / non-zero = true
#   uuid                          16 bytes, big-endian
#   position                      a block pos packed into one i64 (26/26/12 bits)
#   string(N)                     length-prefixed UTF-8, max N UTF-16 code units
#   identifier                    a resource location (string capped at 32767)
#   nbt                           a network-form (unnamed-root) NBT compound
#   prefixed_bytes(N)             a VarInt byte-length prefix, then <=N raw bytes
#   remaining_bytes               every remaining body byte (must be the last field)
#   optional<T>                   a bool flag, then T only when the flag is set
#   prefixed_array<T>             a VarInt count, then that many T
#   <StructName>                  a composite payload declared in [[struct]]
#
# Play-state modeling notes (DOCUMENTED deviations from a byte-faithful spec):
#   * Chunk Data and Update Light carries its heavy per-section block/biome
#     payload (`chunk_data`) and per-section light arrays (`sky_light` /
#     `block_light`) as opaque length-prefixed `prefixed_bytes` blobs. The chunk
#     coordinates, heightmaps, block entities, and light bit masks remain typed.
#     The actual section serialization belongs to a later world<->proto bridge.
#   * Player Info Update keeps its `action` bit mask typed and carries the
#     variable, per-action entry list as `remaining_bytes`; the conditional
#     per-entry layout is decoded by the session<->proto bridge, not here.
#   * Chunk block-entity `data` is modeled as a present `nbt` value (the wire
#     form of minecraft-data's "anonOptionalNbt" when data is present); the
#     degenerate TAG_End "absent" sentinel is not modeled, which is fine for the
#     flat-world join path that emits no block entities.
#
# Ids are the wire packet ids for protocol 772. Notable gotchas baked in below:
#   * Login Success (clientbound 0x02) has NO trailing strict_error_handling
#     bool in 1.21.8 (removed after 767).
#   * Client Information (serverbound 0x00) carries particle_status (added
#     1.21.2), so it is present here.

# --- Shared composite payloads -------------------------------------------------

[[struct]]
name = "Property"
fields = [
    { name = "name", type = "string(64)" },
    { name = "value", type = "string(32767)" },
    { name = "signature", type = "optional<string(1024)>" },
]

[[struct]]
name = "KnownPack"
fields = [
    { name = "namespace", type = "string(32767)" },
    { name = "id", type = "string(32767)" },
    { name = "version", type = "string(32767)" },
]

[[struct]]
name = "RegistryEntry"
fields = [
    { name = "entry_id", type = "identifier" },
    { name = "data", type = "optional<nbt>" },
]

# --- Play-state composite payloads ---------------------------------------------

# The optional "you died here" location carried in the join SpawnInfo.
[[struct]]
name = "DeathLocation"
fields = [
    { name = "dimension_name", type = "identifier" },
    { name = "location", type = "position" },
]

# The per-world spawn info embedded in the Login (Join Game) packet.
[[struct]]
name = "SpawnInfo"
fields = [
    { name = "dimension_type", type = "varint" },
    { name = "dimension_name", type = "identifier" },
    { name = "hashed_seed", type = "i64" },
    # Game mode / previous game mode are single bytes (0..=3, or 255 for "none");
    # signedness is cosmetic, so both are modeled as u8.
    { name = "gamemode", type = "u8" },
    { name = "previous_gamemode", type = "u8" },
    { name = "is_debug", type = "bool" },
    { name = "is_flat", type = "bool" },
    { name = "death_location", type = "optional<DeathLocation>" },
    { name = "portal_cooldown", type = "varint" },
    { name = "sea_level", type = "varint" },
]

# One heightmap in a Chunk Data packet (1.21.5+ networked-heightmap form).
[[struct]]
name = "Heightmap"
fields = [
    { name = "kind", type = "varint" },
    { name = "data", type = "prefixed_array<i64>" },
]

# A block entity carried inline in a Chunk Data packet. `packed_xz` holds the
# section-relative X in the high nibble and Z in the low nibble.
[[struct]]
name = "ChunkBlockEntity"
fields = [
    { name = "packed_xz", type = "u8" },
    { name = "y", type = "i16" },
    { name = "block_entity_type", type = "varint" },
    { name = "data", type = "nbt" },
]

# A spawned entity's initial velocity (three big-endian shorts).
[[struct]]
name = "EntityVelocity"
fields = [
    { name = "x", type = "i16" },
    { name = "y", type = "i16" },
    { name = "z", type = "i16" },
]

# --- Handshaking ---------------------------------------------------------------

[[packet]]
state = "handshake"
direction = "serverbound"
name = "Handshake"
id = 0x00
fields = [
    { name = "protocol_version", type = "varint" },
    { name = "server_address", type = "string(255)" },
    { name = "server_port", type = "u16" },
    { name = "next_state", type = "varint" },
]

# --- Status --------------------------------------------------------------------

[[packet]]
state = "status"
direction = "serverbound"
name = "StatusRequest"
id = 0x00
fields = []

[[packet]]
state = "status"
direction = "serverbound"
name = "PingRequest"
id = 0x01
fields = [{ name = "payload", type = "i64" }]

[[packet]]
state = "status"
direction = "clientbound"
name = "StatusResponse"
id = 0x00
fields = [{ name = "json", type = "string(32767)" }]

[[packet]]
state = "status"
direction = "clientbound"
name = "PongResponse"
id = 0x01
fields = [{ name = "payload", type = "i64" }]

# --- Login ---------------------------------------------------------------------

[[packet]]
state = "login"
direction = "serverbound"
name = "LoginStart"
id = 0x00
fields = [
    { name = "name", type = "string(16)" },
    { name = "uuid", type = "uuid" },
]

[[packet]]
state = "login"
direction = "serverbound"
name = "LoginAcknowledged"
id = 0x03
fields = []

[[packet]]
state = "login"
direction = "clientbound"
name = "LoginDisconnect"
id = 0x00
fields = [{ name = "reason", type = "string(262144)" }]

[[packet]]
state = "login"
direction = "clientbound"
name = "LoginSuccess"
id = 0x02
fields = [
    { name = "uuid", type = "uuid" },
    { name = "name", type = "string(16)" },
    { name = "properties", type = "prefixed_array<Property>" },
]

[[packet]]
state = "login"
direction = "clientbound"
name = "SetCompression"
id = 0x03
fields = [{ name = "threshold", type = "varint" }]

# --- Configuration -------------------------------------------------------------

[[packet]]
state = "configuration"
direction = "serverbound"
name = "ClientInformation"
id = 0x00
fields = [
    { name = "locale", type = "string(16)" },
    { name = "view_distance", type = "i8" },
    { name = "chat_mode", type = "varint" },
    { name = "chat_colors", type = "bool" },
    { name = "displayed_skin_parts", type = "u8" },
    { name = "main_hand", type = "varint" },
    { name = "enable_text_filtering", type = "bool" },
    { name = "allow_server_listings", type = "bool" },
    { name = "particle_status", type = "varint" },
]

[[packet]]
state = "configuration"
direction = "serverbound"
name = "AckFinishConfiguration"
id = 0x03
fields = []

[[packet]]
state = "configuration"
direction = "serverbound"
name = "ServerboundKnownPacks"
id = 0x07
fields = [{ name = "known_packs", type = "prefixed_array<KnownPack>" }]

[[packet]]
state = "configuration"
direction = "clientbound"
name = "FinishConfiguration"
id = 0x03
fields = []

[[packet]]
state = "configuration"
direction = "clientbound"
name = "RegistryData"
id = 0x07
fields = [
    { name = "registry_id", type = "identifier" },
    { name = "entries", type = "prefixed_array<RegistryEntry>" },
]

[[packet]]
state = "configuration"
direction = "clientbound"
name = "ClientboundKnownPacks"
id = 0x0E
fields = [{ name = "known_packs", type = "prefixed_array<KnownPack>" }]

# --- Play ----------------------------------------------------------------------
#
# Ids verified against minecraft-data pc/1.21.8 (commit a8cf733, protocol 772);
# the minecraft-data packet name for each is noted in a comment.

# minecraft-data: play.toServer.teleport_confirm ("Confirm Teleportation"). The
# client replies with the teleport_id from a Synchronize Player Position; the
# server needs no further response.
[[packet]]
state = "play"
direction = "serverbound"
name = "ConfirmTeleportation"
id = 0x00
fields = [{ name = "teleport_id", type = "varint" }]

# minecraft-data: play.toServer.keep_alive
[[packet]]
state = "play"
direction = "serverbound"
name = "ServerboundKeepAlive"
id = 0x1B
fields = [{ name = "keep_alive_id", type = "i64" }]

# minecraft-data: play.toServer.position
[[packet]]
state = "play"
direction = "serverbound"
name = "SetPlayerPosition"
id = 0x1D
fields = [
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    # MovementFlags bit mask: bit 0 = on ground, bit 1 = horizontal collision.
    { name = "flags", type = "u8" },
]

# minecraft-data: play.toServer.position_look
[[packet]]
state = "play"
direction = "serverbound"
name = "SetPlayerPositionAndRotation"
id = 0x1E
fields = [
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    { name = "yaw", type = "f32" },
    { name = "pitch", type = "f32" },
    { name = "flags", type = "u8" },
]

# minecraft-data: play.toServer.block_dig ("Player Action").
[[packet]]
state = "play"
direction = "serverbound"
name = "PlayerAction"
id = 0x28
fields = [
    { name = "status", type = "varint" },
    { name = "location", type = "position" },
    { name = "face", type = "i8" },
    { name = "sequence", type = "varint" },
]

# minecraft-data: play.toServer.block_place ("Use Item On").
[[packet]]
state = "play"
direction = "serverbound"
name = "UseItemOn"
id = 0x3F
fields = [
    { name = "hand", type = "varint" },
    { name = "location", type = "position" },
    { name = "direction", type = "varint" },
    { name = "cursor_x", type = "f32" },
    { name = "cursor_y", type = "f32" },
    { name = "cursor_z", type = "f32" },
    { name = "inside_block", type = "bool" },
    { name = "world_border_hit", type = "bool" },
    { name = "sequence", type = "varint" },
]

# minecraft-data: play.toServer.chat_command (the unsigned command form).
[[packet]]
state = "play"
direction = "serverbound"
name = "ChatCommand"
id = 0x06
fields = [{ name = "command", type = "string(256)" }]

# minecraft-data: play.toServer.chat_message ("Chat Message", the unsigned form).
# Modelled lossily on purpose: the server relays only the message text and ignores
# the 1.19 signing tail (timestamp / salt / signature / acknowledged-bitset), which
# is sound because Join Game advertises enforces_secure_chat = false. The text is
# the typed `message`; everything after it is swallowed as `rest` so the decoder
# stops being an UnknownPacketId without needing a fixed-size buffer(N) type for the
# signature. The generated serverbound encode exists but is exercised only by tests.
[[packet]]
state = "play"
direction = "serverbound"
name = "ChatMessage"
id = 0x08
fields = [
    { name = "message", type = "string(256)" },
    { name = "rest", type = "remaining_bytes" },
]

# minecraft-data: play.toClient.spawn_entity
[[packet]]
state = "play"
direction = "clientbound"
name = "SpawnEntity"
id = 0x01
fields = [
    { name = "entity_id", type = "varint" },
    { name = "entity_uuid", type = "uuid" },
    { name = "entity_type", type = "varint" },
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    { name = "pitch", type = "i8" },
    { name = "yaw", type = "i8" },
    { name = "head_pitch", type = "i8" },
    { name = "data", type = "varint" },
    { name = "velocity", type = "EntityVelocity" },
]

# minecraft-data: play.toClient.block_changed_ack ("Acknowledge Block Change").
# Echoes the sequence number from a serverbound block action (Player Action /
# Use Item On) once the server has accepted (or finished resolving) the edit, so
# the client stops predicting and trusts the authoritative state. A rejected edit
# is healed with a Block Update instead, never an ack.
[[packet]]
state = "play"
direction = "clientbound"
name = "AcknowledgeBlockChange"
id = 0x04
fields = [
    { name = "sequence", type = "varint" },
]

# minecraft-data: play.toClient.block_change ("Block Update").
[[packet]]
state = "play"
direction = "clientbound"
name = "BlockUpdate"
id = 0x08
fields = [
    { name = "location", type = "position" },
    { name = "block_state", type = "varint" },
]

# minecraft-data: play.toClient.unload_chunk ("Unload Chunk"). Tells the client
# to drop a chunk column it no longer needs (one that left its view distance).
# Note the wire field order is Z THEN X — the reverse of every other chunk packet
# (a long-standing protocol quirk), so the order here is deliberate, not a typo.
[[packet]]
state = "play"
direction = "clientbound"
name = "UnloadChunk"
id = 0x21
fields = [
    { name = "chunk_z", type = "i32" },
    { name = "chunk_x", type = "i32" },
]

# minecraft-data: play.toClient.game_state_change ("Game Event"). `reason` is an
# event code (e.g. 13 = level_chunks_load_start, sent to leave the loading
# screen); `value` is the event's float parameter (game mode for reason 3, 0.0
# otherwise).
[[packet]]
state = "play"
direction = "clientbound"
name = "GameEvent"
id = 0x22
fields = [
    { name = "reason", type = "u8" },
    { name = "value", type = "f32" },
]

# minecraft-data: play.toClient.system_chat ("System Chat Message"). One packet
# carries BOTH the chat box and the action bar: `content` is a text component
# encoded as network (anonymous-root) NBT — NOT a JSON string in 1.20.3+ — and
# `overlay = true` renders it above the hotbar (action bar) instead of in the chat
# box. Being a system message it is unsigned, so it sidesteps the entire 1.19
# chat-signing apparatus. The `nbt` type maps to a `ferrumc_nbt::NbtTag` written by
# `ferrumc_nbt::write_network_root` (the anonymous-root compound form the client
# expects); the session crate builds that NbtTag from a `TextComponent`.
[[packet]]
state = "play"
direction = "clientbound"
name = "SystemChat"
id = 0x72
fields = [
    { name = "content", type = "nbt" },
    { name = "overlay", type = "bool" },
]

# minecraft-data: play.toClient.keep_alive
[[packet]]
state = "play"
direction = "clientbound"
name = "ClientboundKeepAlive"
id = 0x26
fields = [{ name = "keep_alive_id", type = "i64" }]

# minecraft-data: play.toClient.map_chunk ("Chunk Data and Update Light"). The
# heavy section payload and light arrays are opaque blobs (see the header notes).
[[packet]]
state = "play"
direction = "clientbound"
name = "ChunkDataAndLight"
id = 0x27
fields = [
    { name = "x", type = "i32" },
    { name = "z", type = "i32" },
    { name = "heightmaps", type = "prefixed_array<Heightmap>" },
    # Up to 2 MiB of packed section data, decoded by the world<->proto bridge.
    { name = "chunk_data", type = "prefixed_bytes(2097152)" },
    { name = "block_entities", type = "prefixed_array<ChunkBlockEntity>" },
    { name = "sky_light_mask", type = "prefixed_array<i64>" },
    { name = "block_light_mask", type = "prefixed_array<i64>" },
    { name = "empty_sky_light_mask", type = "prefixed_array<i64>" },
    { name = "empty_block_light_mask", type = "prefixed_array<i64>" },
    # Each entry is a 2048-byte light nibble array, kept opaque.
    { name = "sky_light", type = "prefixed_array<prefixed_bytes(2048)>" },
    { name = "block_light", type = "prefixed_array<prefixed_bytes(2048)>" },
]

# minecraft-data: play.toClient.login ("Login / Join Game").
[[packet]]
state = "play"
direction = "clientbound"
name = "JoinGame"
id = 0x2B
fields = [
    { name = "entity_id", type = "i32" },
    { name = "is_hardcore", type = "bool" },
    { name = "world_names", type = "prefixed_array<identifier>" },
    { name = "max_players", type = "varint" },
    { name = "view_distance", type = "varint" },
    { name = "simulation_distance", type = "varint" },
    { name = "reduced_debug_info", type = "bool" },
    { name = "enable_respawn_screen", type = "bool" },
    { name = "do_limited_crafting", type = "bool" },
    { name = "world_state", type = "SpawnInfo" },
    { name = "enforces_secure_chat", type = "bool" },
]

# minecraft-data: play.toClient.position ("Synchronize Player Position").
[[packet]]
state = "play"
direction = "clientbound"
name = "SynchronizePlayerPosition"
id = 0x41
fields = [
    { name = "teleport_id", type = "varint" },
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    { name = "dx", type = "f64" },
    { name = "dy", type = "f64" },
    { name = "dz", type = "f64" },
    { name = "yaw", type = "f32" },
    { name = "pitch", type = "f32" },
    # PositionUpdateRelatives bit mask (4-byte Int): which fields are relative.
    { name = "flags", type = "u32" },
]

# minecraft-data: play.toClient.player_info ("Player Info Update"). The variable
# per-action entry list is carried opaque (see the header notes).
[[packet]]
state = "play"
direction = "clientbound"
name = "PlayerInfoUpdate"
id = 0x3F
fields = [
    { name = "action", type = "u8" },
    { name = "entries", type = "remaining_bytes" },
]

# minecraft-data: play.toClient.update_view_position ("Set Center Chunk"). Tells
# the client which chunk the player is centered on; must precede the chunk sends.
[[packet]]
state = "play"
direction = "clientbound"
name = "SetCenterChunk"
id = 0x57
fields = [
    { name = "chunk_x", type = "varint" },
    { name = "chunk_z", type = "varint" },
]

# minecraft-data: play.toClient.spawn_position ("Set Default Spawn Position").
# `angle` is the spawn yaw in degrees.
[[packet]]
state = "play"
direction = "clientbound"
name = "SetDefaultSpawnPosition"
id = 0x5A
fields = [
    { name = "location", type = "position" },
    { name = "angle", type = "f32" },
]

# --- Entity movement / despawn (remote-player visibility) -----------------------
#
# These six entity packets plus RemovePlayerInfo back the remote-player
# visibility path in `ferrumc-session`: a join spawns the remote entity, moves
# update it relatively or by teleport, and a leave despawns it and drops the
# tab-list entry. Ids/field shapes verified against
# `fixtures/protocol/1_21_8/protocol.json` (protocol 772) and the pv772 wiki.

# minecraft-data: play.toClient.sync_entity_position ("Teleport Entity"). Absolute
# reposition for jumps larger than a relative move can encode (>8 blocks). NOTE:
# the resource is `sync_entity_position` (0x1F), NOT `entity_teleport` — the latter
# name maps to a different packet (0x76) with f32 yaw/pitch replaced by i8 angle
# bytes and no velocity fields, so using that name would point at the wrong id and
# the wrong field shape. `velocity_*` are the per-second delta fields (protocol.json
# calls them dx/dy/dz).
[[packet]]
state = "play"
direction = "clientbound"
name = "EntityTeleport"
id = 0x1F
fields = [
    { name = "entity_id", type = "varint" },
    { name = "x", type = "f64" },
    { name = "y", type = "f64" },
    { name = "z", type = "f64" },
    { name = "velocity_x", type = "f64" },
    { name = "velocity_y", type = "f64" },
    { name = "velocity_z", type = "f64" },
    { name = "yaw", type = "f32" },
    { name = "pitch", type = "f32" },
    { name = "on_ground", type = "bool" },
]

# minecraft-data: play.toClient.rel_entity_move ("Update Entity Position"). Relative
# move with no rotation; each delta is `(new - lastSent) * 4096` (12 fractional
# bits) clamped to an i16, so it only encodes moves up to ~8 blocks per axis.
[[packet]]
state = "play"
direction = "clientbound"
name = "UpdateEntityPosition"
id = 0x2E
fields = [
    { name = "entity_id", type = "varint" },
    { name = "delta_x", type = "i16" },
    { name = "delta_y", type = "i16" },
    { name = "delta_z", type = "i16" },
    { name = "on_ground", type = "bool" },
]

# minecraft-data: play.toClient.entity_move_look ("Update Entity Position and
# Rotation"). Relative move plus yaw/pitch as angle bytes (256 = 360 degrees).
[[packet]]
state = "play"
direction = "clientbound"
name = "UpdateEntityPositionAndRotation"
id = 0x2F
fields = [
    { name = "entity_id", type = "varint" },
    { name = "delta_x", type = "i16" },
    { name = "delta_y", type = "i16" },
    { name = "delta_z", type = "i16" },
    { name = "yaw", type = "i8" },
    { name = "pitch", type = "i8" },
    { name = "on_ground", type = "bool" },
]

# minecraft-data: play.toClient.entity_look ("Update Entity Rotation"). Rotation
# only; yaw/pitch are angle bytes (256 = 360 degrees).
[[packet]]
state = "play"
direction = "clientbound"
name = "UpdateEntityRotation"
id = 0x31
fields = [
    { name = "entity_id", type = "varint" },
    { name = "yaw", type = "i8" },
    { name = "pitch", type = "i8" },
    { name = "on_ground", type = "bool" },
]

# minecraft-data: play.toClient.player_remove ("Player Info Remove"). A real
# tab-list removal: a prefixed array of UUIDs. The dedicated 0x3E packet, NOT a
# PlayerInfoUpdate (0x3F) action — the latter has no remove action and is a no-op
# on a real client.
[[packet]]
state = "play"
direction = "clientbound"
name = "RemovePlayerInfo"
id = 0x3E
fields = [
    { name = "players", type = "prefixed_array<uuid>" },
]

# minecraft-data: play.toClient.entity_destroy ("Remove Entities"). Despawns the
# listed entity ids on the client.
[[packet]]
state = "play"
direction = "clientbound"
name = "RemoveEntities"
id = 0x46
fields = [
    { name = "entity_ids", type = "prefixed_array<varint>" },
]

# minecraft-data: play.toClient.entity_head_rotation ("Set Head Rotation").
# `head_yaw` is an angle byte (256 = 360 degrees), separate from the body yaw.
[[packet]]
state = "play"
direction = "clientbound"
name = "SetHeadRotation"
id = 0x4C
fields = [
    { name = "entity_id", type = "varint" },
    { name = "head_yaw", type = "i8" },
]
