[workspace]
resolver = "2"
members = [
    "crates/ferrumc-app",
    "crates/ferrumc-core",
    "crates/ferrumc-config",
    "crates/ferrumc-codec",
    "crates/ferrumc-math",
    "crates/ferrumc-nbt",
    "crates/ferrumc-observability",
    "crates/ferrumc-registry",
    "crates/ferrumc-proto",
    # "crates/ferrumc-proto-gen",  # uncomment when ready
    "crates/ferrumc-net",
    "crates/ferrumc-session",
    "crates/ferrumc-world",
    "crates/ferrumc-storage",
    "crates/ferrumc-sim",
    "crates/ferrumc-command",
    "crates/ferrumc-permission",
    "crates/ferrumc-plugin-api",
    "crates/ferrumc-plugin-host",
    "crates/ferrumc-anvil",
    "crates/ferrumc-testkit",
    "xtask",
]

[workspace.package]
version = "0.2.0-dev"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/ferrumc-rs/ferrumc"
homepage = "https://ferrumc.com"

[workspace.dependencies]
# === Shared types & error handling ===
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
semver = { version = "1", features = ["serde"] }
bitflags = "2"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# === Async runtime ===
tokio = { version = "1", features = ["full"] }

# === Byte manipulation ===
bytes = "1"

# === Logging & metrics ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === Data structures ===
slotmap = "1"
smallvec = { version = "1", features = ["union"] }

# === Storage (may switch after benchmarks — see docs/experiments/) ===
redb = "2"

# === Compression ===
# Both included for benchmarking. One will be chosen. See docs/experiments/compression.md
flate2 = "1"          # zlib for protocol compression
zstd = "0.13"         # zstd for storage compression
lz4_flex = "0.11"     # lz4 for storage compression (alternative)

# === Encryption ===
aes = "0.8"
cfb8 = "0.8"
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"

# === Testing ===
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

# === Internal crates ===
ferrumc-core = { path = "crates/ferrumc-core" }
ferrumc-config = { path = "crates/ferrumc-config" }
ferrumc-math = { path = "crates/ferrumc-math" }
ferrumc-codec = { path = "crates/ferrumc-codec" }
ferrumc-nbt = { path = "crates/ferrumc-nbt" }
ferrumc-observability = { path = "crates/ferrumc-observability" }
ferrumc-registry = { path = "crates/ferrumc-registry" }
ferrumc-proto = { path = "crates/ferrumc-proto" }
ferrumc-net = { path = "crates/ferrumc-net" }
ferrumc-session = { path = "crates/ferrumc-session" }
ferrumc-world = { path = "crates/ferrumc-world" }
ferrumc-storage = { path = "crates/ferrumc-storage" }
ferrumc-sim = { path = "crates/ferrumc-sim" }
ferrumc-command = { path = "crates/ferrumc-command" }
ferrumc-permission = { path = "crates/ferrumc-permission" }
ferrumc-plugin-api = { path = "crates/ferrumc-plugin-api" }
ferrumc-plugin-host = { path = "crates/ferrumc-plugin-host" }
ferrumc-anvil = { path = "crates/ferrumc-anvil" }
ferrumc-testkit = { path = "crates/ferrumc-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Clippy pedantic overrides — these are too noisy for a project this size
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
inherits = "release"
debug = true
