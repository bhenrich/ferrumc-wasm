[workspace]
resolver = "2"
members = [
    "app",
    "crates/ferrumc-core",
    "crates/ferrumc-config",
    "crates/ferrumc-codec",
    "crates/ferrumc-math",
    "crates/ferrumc-nbt",
    "crates/ferrumc-observability",
    "crates/ferrumc-registry",
    "crates/ferrumc-items",
    "crates/ferrumc-proto",
    "crates/ferrumc-proto-gen",
    "crates/ferrumc-net",
    "crates/ferrumc-session",
    "crates/ferrumc-world",
    "crates/ferrumc-storage",
    "crates/ferrumc-sim",
    "crates/ferrumc-command",
    "crates/ferrumc-permission",
    "crates/ferrumc-plugin-api",
    "crates/ferrumc-plugin-host",
    "crates/ferrumc-anvil",
    "crates/ferrumc-placement",
    "crates/ferrumc-dashboard",
    "crates/ferrumc-testkit",
    "plugins/ferrumc-plugin-fixture",
    "plugins/ferrumc-plugin-spawn-protect",
    "plugins/ferrumc-plugin-block-rules",
    "xtask",
]

[workspace.package]
version = "0.2.0-dev"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/ferrumc-rs/ferrumc"
homepage = "https://ferrumc.com"

[workspace.dependencies]
# === Shared types & error handling ===
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
semver = { version = "1", features = ["serde"] }
bitflags = "2"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# === CLI ===
# CLI arg parsing for the ferrumc binary: --config/--port/--bind/--version/--help.
# Replaces the argv[1]-as-config-path footgun with a real, typed, self-documenting
# parser. Derive-only (no `env` feature): the FERRUMC_CONFIG fallback is handled
# manually in Cli::config_path to keep the dependency surface minimal.
clap = { version = "4", features = ["derive"] }

# === Async runtime ===
tokio = { version = "1", features = ["full"] }

# === Web (read-only observability dashboard) ===
# axum is the HTTP router/server for the localhost dashboard; tower/tower-http
# provide the service abstraction and static-asset serving (htmx page) + request
# tracing. All on http 1.x / tower 0.5, kept read-only by construction.
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }

# === Byte manipulation ===
bytes = "1"

# === Logging & metrics ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === Dynamic plugin loading ===
# Cross-platform dlopen/dlsym wrapper for loading plugin cdylibs. Pure-Rust
# façade over the platform loader; the standard choice and the one named in
# ADR-0006.
libloading = "0.8"

# === Data structures ===
slotmap = "1"
smallvec = { version = "1", features = ["union"] }

# === Storage (may switch after benchmarks — see docs/experiments/) ===
redb = "2"

# === Compression ===
# Both included for benchmarking. One will be chosen. See docs/experiments/compression.md
flate2 = "1"          # zlib for protocol compression
zstd = "0.13"         # zstd for storage compression
lz4_flex = "0.11"     # lz4 for storage compression (alternative)

# === Encryption ===
aes = "0.8"
cfb8 = "0.8"
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"

# === Testing ===
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

# === Internal crates ===
ferrumc-core = { path = "crates/ferrumc-core" }
ferrumc-config = { path = "crates/ferrumc-config" }
ferrumc-math = { path = "crates/ferrumc-math" }
ferrumc-codec = { path = "crates/ferrumc-codec" }
ferrumc-nbt = { path = "crates/ferrumc-nbt" }
ferrumc-observability = { path = "crates/ferrumc-observability" }
ferrumc-registry = { path = "crates/ferrumc-registry" }
ferrumc-items = { path = "crates/ferrumc-items" }
ferrumc-proto = { path = "crates/ferrumc-proto" }
ferrumc-proto-gen = { path = "crates/ferrumc-proto-gen" }
ferrumc-net = { path = "crates/ferrumc-net" }
ferrumc-session = { path = "crates/ferrumc-session" }
ferrumc-world = { path = "crates/ferrumc-world" }
ferrumc-storage = { path = "crates/ferrumc-storage" }
ferrumc-sim = { path = "crates/ferrumc-sim" }
ferrumc-command = { path = "crates/ferrumc-command" }
ferrumc-permission = { path = "crates/ferrumc-permission" }
ferrumc-plugin-api = { path = "crates/ferrumc-plugin-api" }
ferrumc-plugin-host = { path = "crates/ferrumc-plugin-host" }
ferrumc-anvil = { path = "crates/ferrumc-anvil" }
ferrumc-placement = { path = "crates/ferrumc-placement" }
ferrumc-dashboard = { path = "crates/ferrumc-dashboard" }
ferrumc-testkit = { path = "crates/ferrumc-testkit" }
ferrumc-plugin-fixture = { path = "plugins/ferrumc-plugin-fixture" }
ferrumc-plugin-spawn-protect = { path = "plugins/ferrumc-plugin-spawn-protect" }
ferrumc-plugin-block-rules = { path = "plugins/ferrumc-plugin-block-rules" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Clippy pedantic overrides — these are too noisy for a project this size
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
inherits = "release"
debug = true
