[package]
name = "ferrumc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferrumc"
path = "src/main.rs"

[dependencies]
# Shared identity / coordinate types crossing every layer boundary.
ferrumc-core = { workspace = true }
ferrumc-math = { workspace = true }
# Access-control config (per-IP connection limit, ban list, whitelist) embedded
# as the AppConfig `[access]` section and resolved into runtime lookup sets.
ferrumc-config = { workspace = true }
# Bounded readers / writers and the wire string + blob newtypes used to drive
# the protocol by hand at the app layer.
ferrumc-codec = { workspace = true }
# Typed 1.21.8 packets (handshake / login / configuration / play) the wiring
# encodes and decodes.
ferrumc-proto = { workspace = true }
# Per-version registry constants (dimension geometry, biome, protocol version).
ferrumc-registry = { workspace = true }
# The item-stack model + trusted/untrusted slot codecs: builds the join-kit
# container body and validates hostile creative-slot bytes.
ferrumc-items = { workspace = true }
# Framing, per-state limits, compression, the offline UUID, and the play-phase
# reader / writer this binary wires onto a real socket.
ferrumc-net = { workspace = true }
# The net <-> sim bridge: the player <-> shard router and its event vocabulary.
ferrumc-session = { workspace = true }
# Tick coordinator, the single simulation shard, and the chunk load-or-generate
# flow that brings the spawn area into memory.
ferrumc-sim = { workspace = true }
# The flat-world generator and the in-memory chunk model.
ferrumc-world = { workspace = true }
# The `WorldStore` trait plus the in-memory backend the slice runs against.
ferrumc-storage = { workspace = true }
# Command tree powering /spawn and /gamemode.
ferrumc-command = { workspace = true }
# Permission subjects/grants backing the spawn-protection bypass check.
ferrumc-permission = { workspace = true }
# The plugin SDK types the connection forms at the intent boundary: block-edit
# attempts and the PluginBlockDecision the host folds.
ferrumc-plugin-api = { workspace = true }
# The plugin host: dynamic loader plus the in-process registry that drives the
# spawn-protect and block-rules plugins' block-decision hooks.
ferrumc-plugin-host = { workspace = true }
# The spawn-protection plugin: loaded dynamically (cdylib) and driven in-process
# (rlib) for its veto policy, config, and bypass permission node.
ferrumc-plugin-spawn-protect = { workspace = true }
# The block-rules sample plugin (deny bedrock, glass -> tinted glass), driven
# in-process to prove the Deny + Replace decision outcomes.
ferrumc-plugin-block-rules = { workspace = true }
# Packet tracing + the metric registry / server clock wired into the connection
# and driver hot paths; the app is the only crate that can fire those hooks.
ferrumc-observability = { workspace = true }
# The read-only localhost dashboard task `main` spawns; it reads the snapshot the
# driver publishes through `ferrumc-observability::SnapshotPublisher`.
ferrumc-dashboard = { workspace = true }

# Single multi-thread Tokio runtime: listener, per-connection tasks, bounded
# channels, intervals, timeouts, and graceful shutdown.
tokio = { workspace = true }
# `BytesMut` buffers backing every encode / decode the wiring performs.
bytes = { workspace = true }
# Application-level error context (anyhow is permitted only in this crate).
anyhow = { workspace = true }
# Structured startup logging.
tracing = { workspace = true }
# Subscriber installed once in `main` to render the logs.
tracing-subscriber = { workspace = true }
# Minimal TOML config parsing.
serde = { workspace = true }
toml = { workspace = true }
# CLI arg parsing (--config/--port/--bind/--version/--help) for the ferrumc
# binary, replacing the old argv[1]-as-config-path footgun.
clap = { workspace = true }

[dev-dependencies]
# The integration test drives a real socket using the same proto encoders and
# codec primitives the server does.
ferrumc-proto = { workspace = true }
ferrumc-codec = { workspace = true }
# Decodes the network-NBT `content` of a clientbound `SystemChat` so the chat /
# command-feedback integration test can assert on the rendered text.
ferrumc-nbt = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
# Build the player UUID carried by the client's Login Start packet.
uuid = { workspace = true }
# Stages the built spawn-protect cdylib in an isolated /plugins directory, and
# backs the world-persistence integration test with a throwaway redb directory.
tempfile = { workspace = true }
# Reopen the persisted redb world store directly and reconstruct chunks to assert
# the persistence integration test's saved-block / zero-overlay properties.
ferrumc-storage = { workspace = true }
ferrumc-world = { workspace = true }
ferrumc-math = { workspace = true }
ferrumc-core = { workspace = true }

[lints]
workspace = true
