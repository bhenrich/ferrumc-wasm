# FerrumC server configuration
# =============================
#
# This file was written automatically on first run. Every setting below is shown
# COMMENTED OUT with its built-in default value. Uncomment a line and change it to
# override that default; leave a line commented to keep the default. An entirely
# untouched file (every line still commented) is valid and runs with the exact
# defaults shown here.
#
# Unknown keys are rejected, so do not invent new ones. After editing, restart the
# server for changes to take effect. The CLI flags --port and --bind override the
# corresponding values below at startup without editing this file.

# --- Networking ---

# Socket address the TCP listener binds to ("IP:port"). Use 0.0.0.0:25565 to accept
# connections from other machines on your network; 127.0.0.1 is loopback only.
# bind = "127.0.0.1:25565"

# Ceiling on simultaneously accepted connections (1..=1024). Also advertised as
# the player max in the server-list ping.
# max_connections = 256

# Deadline applied to each individual socket read and write, in whole seconds
# (1..=300).
# io_timeout_secs = 30

# Packet-compression threshold in bytes (0..=2097152): frames larger than this are
# zlib-compressed. Omitted or negative means compression is DISABLED.
# compression_threshold = 256

# --- World view ---

# Play view distance advertised to clients, in chunks (0..=32). Together with
# max_connections and chunk_stream_interval_ms it may request at most 1100000
# view slots and 3000000 full-view scan units per second.
# view_distance = 10

# Play simulation distance advertised to clients, in chunks (0..=32).
# simulation_distance = 10

# World-spawn position players join at, as finite [x, y, z]. X/Z must be within
# +/-30000000 and overworld Y within -64..=319. The default sits one block above
# the flat grass surface at the centre of the spawn chunk.
# spawn = [8.0, 64.0, 8.0]

# Radius, in chunks, of the spawn area kept permanently resident around spawn
# (0..=8, a (2 * r + 1) square). The maximum keeps 289 chunks resident.
# spawn_chunk_radius = 2

# --- Simulation ---

# Simulation tick rate, in ticks per second (1..=1000). The vanilla rate is 20;
# lowering it slows the whole simulation.
# ticks_per_second = 20

# Interval between clientbound keep-alive pings, in milliseconds (100..=15000).
# keep_alive_interval_ms = 10000

# How often a standing player's view is pumped toward the full view distance, in
# milliseconds (10..=60000). One tick (50 ms at 20 TPS) drains the backlog.
# chunk_stream_interval_ms = 50

# --- Spawn protection ---

# Spawn-protection radius in blocks (positive values up to 30000000, Chebyshev)
# around spawn. 0 or any negative value DISABLES protection.
# spawn_protect_radius = 0

# Player names allowed to bypass spawn protection. Only meaningful when
# spawn_protect_radius is greater than zero.
# spawn_protect_bypass = []

# Maximum blocks affected by one /fill or /replace (0..=1000000), and undo entries
# retained per player (0..=64). Their product may not exceed 1048576 prior cells
# per player.
# max_region_fill_volume = 32768
# region_undo_history = 16

# --- Permissions ---

# Player names granted operator status (permission level 4), letting them run
# operator-gated commands such as /gamemode.
# ops = []

# Permission level granted to a player who is NOT an operator (0..=4). 0 is the
# ordinary "player" tier, which is what makes the operator gate meaningful.
# default_permission_level = 0

# --- Storage & plugins ---

# Directory the persistent world database lives in. The shipping default is "world"
# (a durable redb store created under that directory). Comment this out only if you
# build a custom binary that wants the in-memory store.
# world_dir = "world"

# Directory scanned for dynamic (cdylib) plugins at startup. Omitted means no
# dynamic plugins are loaded.
# plugins_dir = "plugins"

# --- Observability dashboard ---

# Whether the read-only observability dashboard starts alongside the server.
# dashboard_enabled = true

# Socket address the dashboard binds to. Loopback by design so it is not reachable
# off-host unless you change this deliberately.
# dashboard_bind = "127.0.0.1:9090"

# --- World content ---
#
# Where the world's INITIAL terrain comes from. By default the server generates
# its built-in flat world. This is a TOML table, so it must stay BELOW every
# top-level key above. Note this is separate from `world_dir` above: `world_dir`
# is the save/persistence location; `[world]` selects the initial content.
[world]

# Optional path to a vanilla Anvil `region/` directory (the folder holding the
# r.<x>.<z>.mca files). When set, every region file in it is imported into the
# world store at startup, BEFORE the server accepts connections, so a prebuilt map
# populates the world. Leave commented to keep the built-in flat world. A missing
# directory, one with no region files, or a malformed region file aborts startup
# with a clear error (fail fast) rather than silently serving flat terrain.
# anvil_import_dir = "world/region"

# --- Access control ---
#
# Gates for a public-facing server: a per-IP connection limit, a ban list, and an
# optional whitelist. This is a TOML table, so it must stay BELOW every top-level
# key above. Whitelist/ban file paths are resolved relative to the server's working
# directory; a configured-but-missing file is a startup error (fail fast).
[access]

# Maximum concurrent connections allowed from a single source IP. It must not
# exceed max_connections; 0 disables the per-IP limit.
# per_ip_connection_limit = 3

# When true, only whitelisted players may complete login; everyone else is kicked
# with a reason. Default false: a local/alpha server is open. Turn this on before
# exposing the server publicly.
# whitelist_enabled = false

# Inline allow-list of player names and/or UUIDs (a token that parses as a UUID is
# matched by UUID, otherwise by name; names are case-insensitive). Only consulted
# when whitelist_enabled = true. Merged with whitelist_file below.
# whitelist = ["Saad", "069a79f4-44e9-4726-a5be-fca90e38aaf5"]

# Optional path to a newline-delimited allow-list file (one name or UUID per line;
# blank lines and lines starting with # are ignored). Merged with the inline list.
# whitelist_file = "whitelist.txt"

# Deny-list of player names, UUIDs, and/or IP addresses. Always enforced (it wins
# over the whitelist). Name/UUID bans are rejected at login with a reason; IP bans
# are rejected at the accept loop before login. Merged with ban_file below.
# bans = ["Griefer123", "069a79f4-44e9-4726-a5be-fca90e38aaf5", "203.0.113.7"]

# Optional path to a newline-delimited deny-list file (one name, UUID, or IP per
# line; blank lines and # comments ignored). Merged with the inline bans list.
# ban_file = "bans.txt"

# --- Serverbound packet budget ---
#
# Every play connection gets a token bucket. The sustained rate must be
# 1..=10000 frames/second, burst 1..=20000 frames, and burst must be at least the
# rate. Multiplied by max_connections, the server-wide ceilings are 100000
# frames/second and 200000 immediate frames.
[budget]

# sustained_rate = 300.0
# burst = 600.0
