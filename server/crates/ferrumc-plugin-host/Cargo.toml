[package]
name = "ferrumc-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrumc-plugin-api = { workspace = true }
ferrumc-core = { workspace = true }
# Safe trusted-native lifecycle values and host-service callbacks.
ferrumc-plugin-loader = { workspace = true }
# ABI status, event, command, and capability discriminants interpreted by the host.
ferrumc-plugin-abi = { workspace = true }
# Native ABI commands are translated into typed positions, vectors, and intents.
ferrumc-math = { workspace = true }
# The host aggregates plugin-registered commands into a CommandTree.
ferrumc-command = { workspace = true }
# Classifying error types for registry/lifecycle failures.
thiserror = { workspace = true }
# Structured warnings when a plugin panics or overruns its time budget.
tracing = { workspace = true }
# Cross-platform dlopen/dlsym for loading plugin cdylibs across the C ABI.
libloading = { workspace = true }

[dev-dependencies]
# The in-process fixture plugins in tests build versions, permission nodes, and
# coordinates.
semver = { workspace = true }
ferrumc-permission = { workspace = true }
# Real-library integration tests parse Cargo's exact artifact report.
serde_json = { workspace = true }
# Test-only bundle packaging hashes the exact copied fixture library.
sha2 = "0.10"

# This crate cannot inherit the workspace `forbid(unsafe_code)`: it needs FFI
# (libloading + `extern "C"`) for dynamic plugin loading. We mirror the
# workspace clippy config but downgrade unsafe to `deny` so a single, audited
# `#[allow(unsafe_code)]` module (`dynamic::ffi`) can opt in. See
# docs/safety/ferrumc-plugin-host.md.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
