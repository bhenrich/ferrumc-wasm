[package]
name = "ferrumc-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `Tick` is stamped on every packet trace and tick metric; the crate's default
# `serde` feature makes `Tick` serialize into the JSON snapshots.
ferrumc-core = { workspace = true }
# Structured dump/snapshot events (session dump = `warn`, metrics = `info`).
tracing = { workspace = true }
# `derive(Serialize)` on the trace / metric / snapshot DTOs.
serde = { workspace = true }
# On-demand JSON rendering for the dump events and a future exporter.
serde_json = { workspace = true }

[dev-dependencies]
# Round-trips the JSON snapshots in unit tests.
serde_json = { workspace = true }
# Captures the `dump()` tracing events to assert the end-to-end emission path.
tracing-subscriber = { workspace = true }
# Paused virtual time drives the watchdog's manual test clock without sleeps.
tokio = { workspace = true, features = ["test-util"] }
# Parses the approved nested watchdog TOML surface in contract tests.
toml = { workspace = true }

[lints]
workspace = true
