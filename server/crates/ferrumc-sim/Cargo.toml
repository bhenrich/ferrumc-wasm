[package]
name = "ferrumc-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared types: `Tick` drives the coordinator, `PlayerId` keys per-player state,
# `WorldId`/`DimensionId` scope the shard's chunks, and `ServerError` is the
# classifying root that `SimError` converts into.
ferrumc-core = { workspace = true }
# Typed coordinates/geometry: `ShardPos` identifies the shard, `ChunkPos` keys
# resident chunks and tickets, and `Vec3` carries player positions in sim
# messages (never raw tuples, per the coordinate rule).
ferrumc-math = { workspace = true }
# The world model the simulation owns: `Chunk` is the resident chunk data and
# `FlatWorldGenerator` is the miss path of the load-or-generate flow.
ferrumc-world = { workspace = true }
# The storage boundary. The sim talks to persistence through the `WorldStore`
# trait (passed in by reference per call — the sim owns chunk data, never a DB
# handle) and reuses storage's `ChunkKey`/`ChunkRecord`/`SchemaVersion` value
# types for the dirty-chunk save handoff.
ferrumc-storage = { workspace = true }
# `SimError` is a thiserror enum so each failure mode is a classified variant
# with a derived `Display`, per the library error-handling rule.
thiserror = { workspace = true }

[dev-dependencies]
# The load-or-generate flow is `async` because `WorldStore` is. Tests drive it
# with `#[tokio::test]`; tokio is dev-only here (the library pulls in no runtime)
# and is already the workspace's async runtime.
tokio = { workspace = true }

[lints]
workspace = true
