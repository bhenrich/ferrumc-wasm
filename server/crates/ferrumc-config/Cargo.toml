[package]
name = "ferrumc-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Declarative config shapes are deserialized straight from the operator's TOML.
serde = { workspace = true }
# Classifying, structured error variants for config resolution failures (e.g. an
# unreadable whitelist/ban file) instead of opaque strings.
thiserror = { workspace = true }
# Whitelist/ban entries may be UUIDs; parsing and matching them needs the Uuid type.
uuid = { workspace = true }

[dev-dependencies]
# Drives the whitelist/ban *file* resolution tests against throwaway on-disk files
# without polluting the working tree.
tempfile = { workspace = true }
# Round-trips the declarative config shapes (defaults + `deny_unknown_fields`)
# from TOML in tests, matching how the app parses them.
toml = { workspace = true }

[lints]
workspace = true
