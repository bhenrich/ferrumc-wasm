[package]
name = "ferrumc-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared `ServerError`/`Result` and id newtypes (`PlayerId`, `EntityId`,
# `WorldId`, `DimensionId`, `PluginId`, `GameMode`) used by keys and records.
ferrumc-core = { workspace = true }
# The `Chunk` value type stored inside a `ChunkRecord` for save/load.
ferrumc-world = { workspace = true }
# Typed coordinates: `ChunkKey` carries a `ChunkPos` rather than a raw `(i32,
# i32)`, as required by the "coordinates are typed" coding standard.
ferrumc-math = { workspace = true }
# Classifying error variants for `StorageError`.
thiserror = { workspace = true }
# Async methods on the storage traits. `async_trait` is chosen over native
# async-fn-in-trait so the returned futures are boxed and `Send` and the traits
# stay dyn-compatible (`Arc<dyn WorldStore>` for the simulation layer); native
# AFIT cannot express the `Send` bound and trips the `async_fn_in_trait` lint
# under `-D warnings`. This matches the storage model in CLAUDE.md. Pure-Rust
# proc-macro, no runtime added.
async-trait = "0.1"
# The durable embedded backend (`RedbStore`). Pure-Rust, embedded, ACID, no
# native deps; the project default per docs/adr/0007-storage-backend.md.
redb = { workspace = true }
# `RedbStore` runs every (blocking) redb transaction on `spawn_blocking` so DB
# work never blocks an async executor worker, satisfying the "no blocking in
# async" rule. Only the `rt` capability is used; the raw redb handle never
# escapes the crate.
tokio = { workspace = true }
# Reconstructs a `PlayerId` from its 16 raw UUID bytes when decoding a
# `BlockMutationLogRecord` journal entry. Already a workspace dependency;
# pure-Rust, no native deps.
uuid = { workspace = true }

[dev-dependencies]
# Backs the `RedbStore` round-trip/persistence tests with a throwaway on-disk
# database under a temp directory. Test-only; not linked into the library.
tempfile = { workspace = true }

[lints]
workspace = true
