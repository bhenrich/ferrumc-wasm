[package]
name = "ferrumc-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Canonical player identity, including vanilla-compatible offline UUIDs.
ferrumc-core = { workspace = true }
# Typed packet enums + per-(state, direction) dispatch this crate wires framing
# into.
ferrumc-proto = { workspace = true }
# Frame-length reader, bounded reader, and VarInt codecs the framing builds on.
ferrumc-codec = { workspace = true }
# `BytesMut`/`Buf` back the inbound accumulation buffer and the outbound encode
# buffer without intermediate allocations.
bytes = { workspace = true }
# Structured, classifying error variants for hostile-input failures.
thiserror = { workspace = true }
# Async runtime for the live TCP status server (M09): listener, per-connection
# tasks, bounded concurrency (Semaphore), I/O timeouts, and graceful shutdown.
tokio = { workspace = true }
# zlib (de)compression for the post-SetCompression packet framing (M10). Pulls
# the pure-Rust miniz_oxide backend by default; version is workspace-pinned.
flate2 = { workspace = true }
# UUID type for the login flow (Login Start / Login Success carry a player UUID).
# Workspace-pinned; only the always-available `from_bytes`/`as_u128` surface is
# used (no extra crate feature beyond the workspace default is required).
uuid = { workspace = true }
[dev-dependencies]
# Build wire buffers and decode readers in the round-trip / malformed tests.
bytes = { workspace = true }
ferrumc-codec = { workspace = true }
ferrumc-proto = { workspace = true }
# Decode the player UUID echoed back in Login Success during integration tests.
uuid = { workspace = true }
# Property-based malformed-input testing: assert the frame, packet, and
# compression decode paths never panic and respect their caps on arbitrary bytes.
proptest = { workspace = true }

[lints]
workspace = true
