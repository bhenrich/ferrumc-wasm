[package]
name = "ferrumc-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Async trait implementation and deterministic synchronization gates for the
# fault-injecting storage harness. No wall-clock sleeps are used.
async-trait = "0.1"
tokio.workspace = true
# Typed server errors and the storage contract/records exercised by durability
# tests in downstream crates.
ferrumc-core.workspace = true
ferrumc-storage.workspace = true
# Error taxonomy for the harness (hex parse, transcript parse, round-trip,
# script mismatch). Library convention is thiserror, not anyhow.
thiserror.workspace = true
# `BytesMut` is the encode sink the generated proto codecs write into.
bytes.workspace = true
# `BoundedReader`/`CodecError` are the decode source and id-read error used by
# `assert_packet_roundtrip`.
ferrumc-codec.workspace = true
# `Direction`/`ProtoError` model transcript entries and round-trip failures; the
# generated packets are exercised by this crate's tests.
ferrumc-proto.workspace = true
# Packet 57 drives the packaging-independent author contract through both its
# compiled-in adapter and the raw-validated trusted native plugin ABI boundary.
ferrumc-plugin-sdk.workspace = true
ferrumc-plugin-sdk-builtin.workspace = true
ferrumc-plugin-abi.workspace = true
ferrumc-plugin-abi-sys.workspace = true
# ABI semantic decoding must honor the permission crate's full validated node
# bound rather than the unrelated shorter command-name limit.
ferrumc-permission.workspace = true
# Canonical semantic run digests use SHA-256 with an explicitly versioned
# binary grammar. The digest never includes platform or packaging metadata.
sha2 = "0.10"
# ABI event payloads carry UUID bytes and must round-trip without text
# normalization.
uuid.workspace = true

[dev-dependencies]
# SystemChat's golden builds its network-NBT `content` via the NBT value tree.
ferrumc-nbt.workspace = true
# Fault-store journal fixtures use typed coordinates and block states.
ferrumc-math.workspace = true
ferrumc-world.workspace = true
# Packet 52's negative-path QA validates the trusted native plugin loader and
# proves host rollback without adding any production dependency or public API.
ferrumc-plugin-loader.workspace = true
ferrumc-plugin-host.workspace = true
ferrumc-plugin-api.workspace = true
serde_json.workspace = true

[lints]
workspace = true
