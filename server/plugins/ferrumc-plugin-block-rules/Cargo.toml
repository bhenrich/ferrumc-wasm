[package]
name = "ferrumc-plugin-block-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The default rlib preserves the application's established in-process plugin
# API. Selecting only `dynamic` produces the trusted-native ABI-v1 artifact.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["builtin"]
builtin = ["dep:ferrumc-core", "dep:ferrumc-plugin-api"]
dynamic = ["dep:ferrumc-plugin-sdk", "dep:ferrumc-plugin-sdk-dynamic"]

[[test]]
name = "dynamic_bundle"
path = "tests/dynamic_bundle.rs"
required-features = ["builtin"]

[dependencies]
# The default compatibility wrapper uses the established in-process plugin API.
ferrumc-core = { workspace = true, optional = true }
ferrumc-plugin-api = { workspace = true, optional = true }
# The dynamic wrapper targets the packaging-independent author contract, and
# the audited adapter owns the complete modern ABI export.
ferrumc-plugin-sdk = { workspace = true, optional = true }
ferrumc-plugin-sdk-dynamic = { workspace = true, optional = true }
# Generated named block-state / item id constants (`block_state::ids`,
# `item::ids`) so the deny/rewrite rules reference names (BEDROCK, GLASS,
# TINTED_GLASS) instead of magic numbers. Registry is a leaf data crate that
# never depends on plugins, so plugin -> registry keeps the dep direction clean.
ferrumc-registry = { workspace = true }

[dev-dependencies]
# Typed coordinates the unit tests use to build block attempts and the WorldView
# stub.
ferrumc-math = { workspace = true }
# Permission node/resolution types for the permission-facade stub.
ferrumc-permission = { workspace = true }
# The integration regression loads the real modern ABI artifact and validates
# its strict bundle manifest before replaying decision events.
ferrumc-plugin-loader = { workspace = true }
ferrumc-plugin-sdk = { workspace = true }
ferrumc-testkit = { workspace = true }
serde_json = { workspace = true }
# Test-only packaging hashes the exact copied artifact bytes.
sha2 = "0.10"

[lints]
workspace = true
