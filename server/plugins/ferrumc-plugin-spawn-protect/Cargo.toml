[package]
name = "ferrumc-plugin-spawn-protect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Built as both:
# - a `cdylib` so the host's M28 C-ABI loader can load it from a `/plugins`
#   directory across the stable ABI (proving the dynamic loader end to end), and
# - an `rlib` so the application can also drive the same plugin in-process
#   (the C ABI carries no event hook yet, so the veto logic runs in-process —
#   see the crate docs and the milestone notes).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Identity, text components, and the player id the plugin reasons about.
ferrumc-core = { workspace = true }
# Typed block coordinates for the spawn-radius test.
ferrumc-math = { workspace = true }
# The stable plugin SDK: the in-process `Plugin` trait, capability manifest,
# events, intents, storage, and the narrow C ABI the cdylib exports.
ferrumc-plugin-api = { workspace = true }
# The bypass permission node the plugin consults through the permission API.
ferrumc-permission = { workspace = true }

# This crate cannot inherit the workspace `forbid(unsafe_code)`: exporting the
# `#[no_mangle]` C entrypoint counts as unsafe code under modern rustc. We
# downgrade to `deny` and scope a single `#[allow(unsafe_code)]` to that export.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
